name: Release

on:
  pull_request:
    branches: [release/default, release/insiders]
    types: [closed]

permissions: {}

concurrency:
  group: release-${{ github.base_ref == 'release/insiders' && 'insiders' || 'stable' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      tarball: ${{ steps.package.outputs.tarball }}
      plugin_tarball: ${{ steps.plugin.outputs.tarball }}
      universal_tarball: ${{ steps.plugin.outputs.universal_tarball }}
      version: ${{ steps.release.outputs.version }}
    env:
      CI: true
      SONORANCE_AUTOMATION: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve release version and npm channel
        id: release
        env:
          RELEASE_CHANNEL: ${{ github.base_ref == 'release/insiders' && 'insiders' || 'stable' }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version")
          if [[ "$base" == *-* ]]; then
            echo "::error::package.json must contain a stable base version, not $base"
            exit 1
          fi
          if [ "$RELEASE_CHANNEL" = "insiders" ]; then
            version="${base}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            tag="insiders"
            prerelease="true"
          else
            version="$base"
            tag="latest"
            prerelease="false"
          fi
          npm version --no-git-tag-version --allow-same-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and verify immutable package
        id: package
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent | tail -n 1)
          test -f "$tarball"
          node scripts/verify-tarball.mjs "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Build and verify universal self-contained distribution
        id: plugin
        run: |
          set -euo pipefail
          npm run build:plugin
          plugin_tarball="deliberate-plugin-v${{ steps.release.outputs.version }}.tgz"
          universal_tarball="deliberate-v${{ steps.release.outputs.version }}.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --transform='s,^deliberate,deliberate-plugin,' -czf "$plugin_tarball" -C dist deliberate
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$universal_tarball" -C dist/deliberate .
          test -f "$plugin_tarball"
          test -f "$universal_tarball"
          node scripts/verify-plugin.mjs dist/deliberate --self-contained
          node scripts/verify-distribution-archive.mjs "$plugin_tarball"
          node scripts/verify-distribution-archive.mjs "$universal_tarball"
          echo "tarball=$plugin_tarball" >> "$GITHUB_OUTPUT"
          echo "universal_tarball=$universal_tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-package
          path: |
            ${{ steps.plugin.outputs.tarball }}
            ${{ steps.plugin.outputs.universal_tarball }}
          if-no-files-found: error
          retention-days: 7

  release-preflight:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution-package
      - name: Mint release token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify release destination
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ needs.build.outputs.version }}"
          sha="${{ needs.build.outputs.sha }}"
          tag_type=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.type 2>/dev/null || true)
          if [ -z "$tag_type" ]; then
            echo "$tag is available for the verified release source."
          else
            tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)
            if [ "$tag_type" = "tag" ]; then
              tag_sha=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq .object.sha)
            fi
            if [ "$tag_sha" != "$sha" ]; then
              echo "::error::$tag points to $tag_sha, not $sha."
              exit 1
            fi
          fi
          if release_lookup=$(gh api "repos/$GH_REPO/releases/tags/$tag" 2>&1); then
            release_exists=true
          elif grep -q 'HTTP 404' <<<"$release_lookup"; then
            release_exists=false
          else
            echo "::error::Could not verify whether $tag already has a GitHub release."
            exit 1
          fi
          if [ "$release_exists" = "true" ]; then
            release_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            release_prerelease=$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)
            if [ "$release_draft" != "false" ] || [ "$release_prerelease" != "${{ needs.build.outputs.prerelease }}" ]; then
              echo "::error::$tag release state does not match the verified channel."
              exit 1
            fi
            if [ "${{ needs.build.outputs.prerelease }}" = "false" ]; then
              latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
              if [ "$latest_tag" != "$tag" ]; then
                echo "::error::$tag is stable but is not the repository's latest release."
                exit 1
              fi
            fi
            asset="${{ needs.build.outputs.universal_tarball }}"
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            unexpected=$(printf '%s\n' "$assets" | sed '/^$/d' | grep -Fvx "$asset" || true)
            if [ -n "$unexpected" ]; then
              echo "::error::$tag must contain only $asset, but also contains: $unexpected"
              exit 1
            fi
            if printf '%s\n' "$assets" | grep -Fxq "$asset"; then
              mkdir .release-assets
              trap 'rm -rf .release-assets' EXIT
              gh release download "$tag" --pattern "$asset" --dir .release-assets
              if ! cmp -s "$asset" ".release-assets/$asset"; then
                echo "::error::$tag already has a different $asset."
                exit 1
              fi
            fi
          fi

  publish:
    needs: [build, release-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Publish or resume exact npm artifact
        env:
          PACKAGE_NAME: deliberate-cli
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          local_sha=$(shasum -a 1 "$TARBALL" | cut -d' ' -f1)
          remote_sha=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.shasum 2>/dev/null || true)
          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$local_sha" ]; then
              echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION already exists with a different artifact."
              exit 1
            fi
            remote_tag=$(npm view "$PACKAGE_NAME" "dist-tags.${{ needs.build.outputs.tag }}" 2>/dev/null || true)
            if [ "$remote_tag" != "$PACKAGE_VERSION" ]; then
              echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION exists, but the ${{ needs.build.outputs.tag }} tag points to $remote_tag."
              exit 1
            fi
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published with the verified artifact; resuming."
          else
            npm publish "./$TARBALL" --ignore-scripts --access public --tag "${{ needs.build.outputs.tag }}"
          fi

  github-release:
    needs: [build, release-preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution-package
      - name: Mint release token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create or resume GitHub release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ needs.build.outputs.version }}"
          sha="${{ needs.build.outputs.sha }}"
          tag_type=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.type 2>/dev/null || true)
          if [ -z "$tag_type" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            for attempt in {1..10}; do
              tag_type=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.type 2>/dev/null || true)
              if [ -n "$tag_type" ]; then break; fi
              sleep 2
            done
            if [ -z "$tag_type" ]; then
              echo "::error::$tag was created but did not become visible."
              exit 1
            fi
          fi
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)
          if [ "$tag_type" = "tag" ]; then
            tag_sha=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq .object.sha)
          fi
          if [ "$tag_sha" != "$sha" ]; then
            echo "::error::$tag points to $tag_sha, not $sha."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub release; resuming."
          else
            args=()
            if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); else args+=(--latest); fi
            gh release create "$tag" --title "Deliberate ${{ needs.build.outputs.version }}" --generate-notes --verify-tag "${args[@]}"
          fi
          release_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          release_prerelease=$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)
          if [ "$release_draft" != "false" ] || [ "$release_prerelease" != "${{ needs.build.outputs.prerelease }}" ]; then
            echo "::error::$tag release state does not match the verified channel."
            exit 1
          fi
          if [ "${{ needs.build.outputs.prerelease }}" = "false" ]; then
            latest_tag=""
            for attempt in {1..10}; do
              latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
              if [ "$latest_tag" = "$tag" ]; then break; fi
              sleep 2
            done
            if [ "$latest_tag" != "$tag" ]; then
              echo "::error::$tag is stable but is not the repository's latest release."
              exit 1
            fi
          fi
          asset="${{ needs.build.outputs.universal_tarball }}"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          unexpected=$(printf '%s\n' "$assets" | sed '/^$/d' | grep -Fvx "$asset" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::$tag must contain only $asset, but also contains: $unexpected"
            exit 1
          fi
          if printf '%s\n' "$assets" | grep -Fxq "$asset"; then
            mkdir .release-assets
            trap 'rm -rf .release-assets' EXIT
            gh release download "$tag" --pattern "$asset" --dir .release-assets
            if ! cmp -s "$asset" ".release-assets/$asset"; then
              echo "::error::$tag already has a different $asset."
              exit 1
            fi
            echo "$tag already has the verified universal artifact; resuming."
          else
            gh release upload "$tag" "$asset"
          fi
          final_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          if [ "$final_assets" != "$asset" ]; then
            echo "::error::$tag does not contain exactly the universal release asset $asset."
            exit 1
          fi
